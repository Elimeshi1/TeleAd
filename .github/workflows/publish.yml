name: Publish to PyPI

# Publishes telead to PyPI. Three ways to start it:
#   * Actions → Publish to PyPI → Run workflow — publishes the version in
#     telead/__init__.py and creates the v<version> tag and GitHub release;
#   * pushing a v<version> tag — the same, for an existing tag;
#   * publishing a GitHub release by hand — publishes only.
# Uses PyPI Trusted Publishing, so no token is stored in the repository.
# One-time setup on pypi.org: Publishing → Add a pending publisher →
#   owner Elimeshi1, repository TeleAd, workflow publish.yml, environment pypi.
#
# To release: bump __version__ in telead/__init__.py, push, then use one of
# the three above.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Check the tag matches the package version
        if: github.event_name != 'workflow_dispatch'
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('telead/__init__.py').read()).group(1))")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/telead/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # A release published by hand already has one; the other triggers get one
    # here. On a manual run this also creates the v<version> tag.
    needs: publish
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('telead/__init__.py').read()).group(1))")
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
