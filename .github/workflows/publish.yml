name: Publish to PyPI

# Publishes telead to PyPI when a v* tag is pushed (a GitHub release is then
# created for it), or when a GitHub release is published by hand.
# Uses PyPI Trusted Publishing, so no token is stored in the repository.
# One-time setup on pypi.org: Publishing → Add a pending publisher →
#   owner Elimeshi1, repository TeleAd, workflow publish.yml, environment pypi.
#
# To release: bump __version__ in telead/__init__.py, push, then push a tag
#   git tag v<version> && git push origin v<version>
# or create a release whose tag is v<version> (for example v0.1.0).

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Check the tag matches the package version
        if: github.event_name != 'workflow_dispatch'
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('telead/__init__.py').read()).group(1))")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/telead/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # A pushed tag gets a GitHub release too; a release published by hand
    # already has one.
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
