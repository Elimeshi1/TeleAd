[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "telead"
description = "A Python library for the Telegram Ads API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Eli Meshi" }]
requires-python = ">=3.9"
dynamic = ["version"]
keywords = ["telegram", "telegram-ads", "ads", "advertising", "api"]
dependencies = ["requests>=2.25"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Office/Business",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://elimeshi1.github.io/TeleAd/"
Source = "https://github.com/Elimeshi1/TeleAd"
Issues = "https://github.com/Elimeshi1/TeleAd/issues"
Changelog = "https://github.com/Elimeshi1/TeleAd/releases"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.dynamic]
version = { attr = "telead.__version__" }

[tool.setuptools.packages.find]
include = ["telead*"]

[tool.setuptools.package-data]
telead = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
